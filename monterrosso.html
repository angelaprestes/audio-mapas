<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monterosso</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Georgia, serif;
}

.player {
    width: 100%;
    max-width: 520px;
    height: 80px;

    background: #9a0303;

    border-radius: 12px;

    display: flex;
    align-items: center;

    padding: 14px 18px;

    box-sizing: border-box;
}

button {
    width: 44px;
    height: 44px;

    border: none;
    border-radius: 50%;

    background: white;
    color: #9a0303;

    font-size: 18px;

    cursor: pointer;

    margin-right: 16px;

    flex-shrink: 0;
}

.info {
    color: white;
    width: 100%;
}

.title {
    font-size: 15px;
    margin-bottom: 8px;
}

audio {
    width: 100%;
    height: 28px;
}
</style>
</head>

<body>

<div class="player">

    <button id="playBtn">▶</button>

    <div class="info">
        <div class="title">
            Escuta de Monterosso
        </div>

        <audio id="audio">
            <source src="https://archive.org/download/Monterosso/Monterosso.m4a" type="audio/mp4">
        </audio>
    </div>

</div>

<script>
const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");

playBtn.addEventListener("click", () => {

    if (audio.paused) {
        audio.play();
        playBtn.innerHTML = "❚❚";
    } else {
        audio.pause();
        playBtn.innerHTML = "▶";
    }

});

audio.addEventListener("ended", () => {
    playBtn.innerHTML = "▶";
});
</script>

</body>
</html>
